{{- if .Values.prometheus.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.prometheus.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.prometheus.ingress.serviceName }}
                port:
                  number: {{ .Values.prometheus.ingress.servicePort }}
{{- end }}
{{- if .Values.alertmanager.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
