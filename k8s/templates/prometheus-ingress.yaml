spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.alertmanager.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.alertmanager.ingress.serviceName }}
