# ============================================================
# any-cloud-management — Spring Boot 공통 설정 (base)
# ============================================================
# 환경별 override는 application-{profile}.properties 에서 수행:
#   - local : 로컬 직접 실행 (./gradlew bootRun)
#   - docker: Docker 컨테이너 실행
#
# 활성화 방법:
#   - 로컬 : ./gradlew bootRun --args='--spring.profiles.active=local'
#            또는 IDE Run Configuration에 SPRING_PROFILES_ACTIVE=local
#   - Docker: Dockerfile/docker-compose.yml 에서 SPRING_PROFILES_ACTIVE=docker
#
# 모든 환경 변수는 ${VAR:default} 형태이므로 profile 미지정 시에도 동작합니다.
# ============================================================

# ─── DataSource ──────────────────────────────────────────────
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${DATABASE_HOST:localhost}:${DATABASE_PORT:13306}/${DATABASE_NAME:aipaas}
spring.datasource.username=${DATABASE_USERID:anycloud}
spring.datasource.password=${DATABASE_USERPASS:anycloud}

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}

# ─── Server ──────────────────────────────────────────────────
server.port=${SERVER_PORT:8888}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# ─── Swagger / OpenAPI ───────────────────────────────────────
spring.messages.encoding=UTF-8
springdoc.api-docs.path=/docs/json
springdoc.swagger-ui.path=/docs
springdoc.api-docs.groups.enabled=true
springdoc.cache.disabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ─── Actuator ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.defaults.enabled=true

# ─── 모니터링 (Prometheus) ───────────────────────────────────
# 새 cluster row INSERT 시 monit_server_url 초기값.
# 이미 등록된 cluster.monit_server_url 은 덮어쓰지 않음 (DB 값 우선).
# 실제 메트릭 조회는 cluster.monit_server_url 에서 직접 읽음.
anycloud.monit.default-url=${MONIT_DEFAULT_URL:http://localhost:9090}

# ─── Kubernetes ──────────────────────────────────────────────
# kubeconfig 파일 경로. KUBECONFIG 표준 환경변수가 있으면 코드에서 우선 사용.
# 비워두면 DB 기반 kubeconfig 생성으로 폴백 (legacy).
kubernetes.kubeconfig.path=${KUBECONFIG_PATH:../config/kubeconfig}
