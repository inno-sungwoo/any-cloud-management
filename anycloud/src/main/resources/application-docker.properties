# ============================================================
# Docker profile — 컨테이너 실행
# ============================================================
# 활성화: SPRING_PROFILES_ACTIVE=docker
#   - Dockerfile 의 ENV 또는
#   - docker-compose.yml 의 environment 블록에서 주입
#
# 환경 변수는 docker-compose.yml 의 anycloud-backend.environment 에서 주입됩니다.
# 모든 변수는 ${VAR:default} 형태이므로 .env 또는 environment 미설정 시
# 컨테이너 네트워크 기본값으로 동작합니다.
# ============================================================

# ─── DataSource (컨테이너 네트워크) ──────────────────────────
# 호스트가 localhost(13306)이 아닌 docker 서비스명(anycloud-db:3306)
spring.datasource.url=jdbc:mariadb://${DATABASE_HOST:anycloud-db}:${DATABASE_PORT:3306}/${DATABASE_NAME:aipaas}

# ─── JPA — 컨테이너에서는 스키마 자동 갱신 허용 ──────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ─── Kubernetes — 컨테이너 내부 마운트 경로 ─────────────────
# docker-compose.yml 의 volumes: - ./config:/app/config:ro 와 일치해야 함
kubernetes.kubeconfig.path=${KUBECONFIG_PATH:/app/config/kubeconfig}

# ─── 모니터링 — Linux 컨테이너에서 호스트의 Prometheus 호출 ─
# extra_hosts 에 host.docker.internal:host-gateway 가 설정되어 있어야 함
anycloud.monit.default-url=${MONIT_DEFAULT_URL:http://host.docker.internal:9090}
