# Mock nvidia-smi-exporter for Docker Desktop demo
# Simulates 4x RTX 3060 GPU metrics without real hardware
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-nvidia-smi-exporter
  namespace: ai-pass3
  labels:
    app: nvidia-smi-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nvidia-smi-exporter
  template:
    metadata:
      labels:
        app: nvidia-smi-exporter
    spec:
      containers:
        - name: exporter
          image: mock-nvidia-smi-exporter:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9835
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-smi-exporter
  namespace: ai-pass3
  labels:
    app: nvidia-smi-exporter
spec:
  selector:
    app: nvidia-smi-exporter
  ports:
    - port: 9835
      targetPort: 9835
      name: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-smi-exporter
  namespace: ai-pass3
  labels:
    release: ai-pass3-prom
spec:
  selector:
    matchLabels:
      app: nvidia-smi-exporter
  endpoints:
    - port: metrics
      interval: 15s
