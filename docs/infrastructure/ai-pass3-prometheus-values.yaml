# ai-pass3 과제 전용 Prometheus Stack
# Docker Desktop 시연 환경용 (Mock GPU exporter 연동)

grafana:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    retention: 14d
    storageSpec: {}
    # 모든 ServiceMonitor/PodMonitor를 수집 (네임스페이스 제한 없음)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

# GPU alert rules (nvidia_smi metrics from mock exporter)
additionalPrometheusRulesMap:
  gpu-alerts:
    groups:
      - name: gpu-alerts
        rules:
          - alert: GPUIdleWarning
            expr: nvidia_smi_utilization_gpu_ratio * 100 < 20
            for: 10m
            labels:
              severity: warning
            annotations:
              description: "GPU {{ $labels.uuid }} is idle (utilization {{ $value }}%)"
              message: "GPU 활용률 20% 미만 - 유휴 자원 감지"
          - alert: GPUHighMemoryUsage
            expr: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes > 0.9
            for: 5m
            labels:
              severity: critical
            annotations:
              description: "GPU {{ $labels.uuid }} memory usage > 90%"
              message: "GPU 메모리 사용률 90% 초과"
  fake-gpu-resources:
    groups:
      - name: fake.gpu.resources
        interval: 30s
        rules:
          # ai-pass3에 GPU 1개 사용 중인 것처럼 시뮬레이션
          - record: kube_pod_container_resource_requests
            expr: vector(1)
            labels:
              resource: nvidia_com_gpu
              namespace: ai-pass3
              pod: gpu-jupyter-0
              container: notebook
              node: desktop-control-plane
              instance: "localhost:8443"
              job: kube-state-metrics
          # gpu_operator_gpu_nodes_total 보조 (mock exporter에서도 제공)
          - record: gpu_operator_gpu_nodes_total
            expr: vector(1)

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
